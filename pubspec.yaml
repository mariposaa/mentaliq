publish_to: 'none'

version: 1.0.0+11

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  google_sign_in: ^6.3.0
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.6
  
  # AI - Gemini
  google_generative_ai: ^0.4.6
  
  # Device Recognition (for silent auth)
  device_info_plus: ^11.1.0
  
  # State Management
  provider: ^6.1.2
  
  # UI & Styling
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
