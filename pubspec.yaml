  shared_preferences: ^2.3.3
  intl: ^0.20.2
  flutter_dotenv: ^5.2.1
  uuid: ^4.5.1
  percent_indicator: ^4.2.3
  share_plus: ^10.1.0
  path_provider: ^2.1.4
  
  # Image Picker
  image_picker: ^1.0.7
  image_picker_for_web: ^3.0.5
  record: ^6.1.2
  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1
  audioplayers: ^6.4.0
  http: ^1.6.0
  geolocator: ^12.0.0
  google_mobile_ads: ^7.0.0
  timezone: ^0.11.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

